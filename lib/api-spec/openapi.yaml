openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Salama Park Residents Association governance portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public, redacted association information
  - name: resident
    description: Authenticated resident operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/overview:
    get:
      operationId: getPublicOverview
      tags: [public]
      summary: Get public petition and membership progress
      responses:
        "200":
          description: Publicly approved aggregate progress only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOverview"
  /public/documents:
    get:
      operationId: getPublicDocuments
      tags: [public]
      summary: List approved public governance documents
      responses:
        "200":
          description: Approved public documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicDocument"
  /public/announcements:
    get:
      operationId: getPublicAnnouncements
      tags: [public]
      summary: List published public announcements
      responses:
        "200":
          description: Published announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAnnouncement"
  /public/petition:
    get:
      operationId: getPublicPetition
      tags: [public]
      summary: Get the active petition rules and exact document versions
      responses:
        "200":
          description: Petition details and whether signing is currently enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPetition"
  /public/poll:
    get:
      operationId: getPublicPollResults
      tags: [public]
      summary: Get the live monthly subscription poll and household tallies
      responses:
        "200":
          description: Aggregate poll results with no personal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPollResults"
  /resident/application:
    post:
      operationId: submitResidentApplication
      tags: [resident]
      summary: Submit an authenticated resident membership application
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentApplicationInput"
      responses:
        "201":
          description: Application received for verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentApplication"
        "400":
          description: Invalid application
        "401":
          description: Authentication required
        "409":
          description: An application already exists for this account
  /resident/application/me:
    get:
      operationId: getMyResidentApplication
      tags: [resident]
      summary: Get the authenticated resident's application status
      security:
        - clerkSession: []
      responses:
        "200":
          description: The resident's application or null when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentApplicationStatus"
        "401":
          description: Authentication required
  /resident/petition:
    post:
      operationId: submitPetitionConsent
      tags: [resident]
      summary: Submit an authenticated petition declaration for the exact published versions
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetitionConsentInput"
      responses:
        "201":
          description: Consent recorded and receipt issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetitionReceipt"
        "400":
          description: Declaration incomplete or invalid
        "401":
          description: Authentication required
        "409":
          description: Petition is closed or an active signature already exists
        "422":
          description: No approved petition and constitution versions are available
  /resident/petition/receipts:
    get:
      operationId: getMyPetitionReceipts
      tags: [resident]
      summary: List the authenticated resident's petition receipts without declaration details
      security:
        - clerkSession: []
      responses:
        "200":
          description: The resident's own petition receipt references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResidentPetitionReceipt"
        "401":
          description: Authentication required
  /resident/petition/withdraw:
    post:
      operationId: withdrawMyPetitionSignature
      tags: [resident]
      summary: Request withdrawal of the resident's active petition signature before closing
      security:
        - clerkSession: []
      responses:
        "200":
          description: Signature withdrawn with a new receipt status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetitionWithdrawal"
        "401":
          description: Authentication required
        "409":
          description: No active signature or petition withdrawal deadline has passed
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [resident]
      summary: Verify administrative role from server-side identity metadata
      security:
        - clerkSession: []
      responses:
        "200":
          description: Caller role and management access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
        "401":
          description: Authentication required
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [resident]
      summary: Get aggregate administrative workflow counts
      security:
        - clerkSession: []
      responses:
        "200":
          description: Administrative counts without exposing ballot choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Authentication required
        "403":
          description: Association administrator role required
  /admin/applications:
    get:
      operationId: getAdminApplications
      tags: [resident]
      summary: Search and page through membership applications for authorized reviewers
      security:
        - clerkSession: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending-verification, clarification-requested, verified, rejected]
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: A paginated, authorized application list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationPage"
        "401":
          description: Authentication required
        "403":
          description: Authorized association role required
  /admin/applications/{id}/review:
    post:
      operationId: reviewMembershipApplication
      tags: [resident]
      summary: Record a membership verification decision with a reason
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationReviewInput"
      responses:
        "200":
          description: Updated application decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplication"
        "400":
          description: Invalid decision or missing reason
        "401":
          description: Authentication required
        "403":
          description: Returning Officer or administrator role required
        "404":
          description: Application not found
        "409":
          description: The application already has a final decision; set override to replace it
  /admin/petition/submissions:
    get:
      operationId: getAdminPetitionSubmissions
      tags: [resident]
      summary: Page through petition submissions for verification review
      security:
        - clerkSession: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          schema:
            type: string
            enum: [accepted, disputed, rejected, withdrawn]
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: A paginated list of petition submissions for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPetitionSubmissionPage"
        "401":
          description: Authentication required
        "403":
          description: Returning Officer or administrator role required
  /admin/petition/submissions/{id}/verify:
    post:
      operationId: verifyPetitionSubmission
      tags: [resident]
      summary: Record a verification decision for a petition signature
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetitionVerificationInput"
      responses:
        "200":
          description: Updated verification decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPetitionSubmission"
        "400":
          description: Invalid verification decision or missing reason
        "401":
          description: Authentication required
        "403":
          description: Returning Officer or administrator role required
        "404":
          description: Submission not found
  /admin/register-snapshots:
    get:
      operationId: getAdminRegisterSnapshots
      tags: [resident]
      summary: List published register snapshots, newest first
      security:
        - clerkSession: []
      responses:
        "200":
          description: The published register snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRegisterSnapshot"
        "401":
          description: Authentication required
        "403":
          description: Association administrator role required
    post:
      operationId: createAdminRegisterSnapshot
      tags: [resident]
      summary: Publish a register snapshot that fixes the verified denominator
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSnapshotInput"
      responses:
        "201":
          description: The published register snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegisterSnapshot"
        "400":
          description: Invalid register snapshot details
        "401":
          description: Authentication required
        "403":
          description: Association administrator role required
  /admin/petition/configuration:
    get:
      operationId: getAdminPetitionConfiguration
      tags: [resident]
      summary: Read the current petition configuration and its derived state
      security:
        - clerkSession: []
      responses:
        "200":
          description: The current petition configuration, or null when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPetitionConfigurationState"
        "401":
          description: Authentication required
        "403":
          description: Association administrator role required
  /admin/petition/configuration/save:
    post:
      operationId: saveAdminPetitionConfiguration
      tags: [resident]
      summary: Create or replace the draft petition configuration
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetitionConfigurationInput"
      responses:
        "200":
          description: The saved draft petition configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPetitionConfigurationState"
        "400":
          description: Invalid petition configuration
        "401":
          description: Authentication required
        "403":
          description: Association administrator role required
  /admin/petition/configuration/approve:
    post:
      operationId: approveAdminPetitionConfiguration
      tags: [resident]
      summary: Approve the current draft configuration to open the signing window
      security:
        - clerkSession: []
      responses:
        "200":
          description: The approved petition configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPetitionConfigurationState"
        "400":
          description: Configuration is incomplete and cannot be approved
        "401":
          description: Authentication required
        "403":
          description: Returning Officer or administrator role required
        "404":
          description: No petition configuration exists to approve
  /admin/petition/configuration/close:
    post:
      operationId: closeAdminPetitionConfiguration
      tags: [resident]
      summary: Close the petition so no further signatures are accepted
      security:
        - clerkSession: []
      responses:
        "200":
          description: The closed petition configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPetitionConfigurationState"
        "401":
          description: Authentication required
        "403":
          description: Returning Officer or administrator role required
        "404":
          description: No petition configuration exists to close
  /admin/roles:
    get:
      operationId: getAdminRoles
      tags: [resident]
      summary: List every account holding an association role
      security:
        - clerkSession: []
      responses:
        "200":
          description: Active role assignments, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleRegister"
        "401":
          description: Authentication required
        "403":
          description: Association administrator role required
  /admin/roles/grant:
    post:
      operationId: grantAdminRole
      tags: [resident]
      summary: Grant an association role to an account
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleGrantInput"
      responses:
        "200":
          description: The role assignments for that account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleAssignment"
        "400":
          description: Invalid user or role
        "401":
          description: Authentication required
        "403":
          description: Association administrator role required
  /admin/roles/revoke:
    post:
      operationId: revokeAdminRole
      tags: [resident]
      summary: Revoke an association role from an account
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRevokeInput"
      responses:
        "200":
          description: The remaining role assignments for that account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleAssignment"
        "400":
          description: Invalid request, or an attempt to remove your own administrator role
        "401":
          description: Authentication required
        "403":
          description: Association administrator role required
  /admin/finance/overview:
    get:
      operationId: getAdminFinanceOverview
      tags: [resident]
      summary: Subscription and expenditure totals for the active period
      security:
        - clerkSession: []
      responses:
        "200":
          description: Finance totals for the active subscription period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFinanceOverview"
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
  /admin/geo/street-stats:
    get:
      operationId: getAdminGeoStreetStats
      tags: [resident]
      summary: Get per-street membership counts for the geo heatmap
      security:
        - clerkSession: []
      parameters:
        - name: verifiedOnly
          in: query
          required: false
          schema:
            type: string
        - name: includeAll
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Street counts for verified or non-rejected applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGeoStreetStats"
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
  /admin/finance/periods:
    get:
      operationId: getAdminFinancePeriods
      tags: [resident]
      summary: List subscription periods and their tier amounts
      security:
        - clerkSession: []
      responses:
        "200":
          description: All configured subscription periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancePeriod"
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
    post:
      operationId: createAdminFinancePeriod
      tags: [resident]
      summary: Create a subscription period with its tier amounts
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancePeriodInput"
      responses:
        "200":
          description: The created subscription period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancePeriod"
        "400":
          description: Invalid year, amounts or currency
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
        "409":
          description: A period already exists for that year
  /admin/finance/periods/{id}/generate:
    post:
      operationId: generateAdminFinanceCharges
      tags: [resident]
      summary: Raise subscription charges for every verified member
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: How many charges were raised, skipped or raised already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceChargeGeneration"
        "400":
          description: The period is closed
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
        "404":
          description: Subscription period not found
  /admin/finance/charges:
    get:
      operationId: getAdminFinanceCharges
      tags: [resident]
      summary: Page through member subscription charges
      security:
        - clerkSession: []
      parameters:
        - name: periodId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [outstanding, part-paid, paid, waived]
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: A paginated list of subscription charges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFinanceChargePage"
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
  /admin/finance/charges/{id}/payments:
    post:
      operationId: recordAdminFinancePayment
      tags: [resident]
      summary: Record a payment received against a subscription charge
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancePaymentInput"
      responses:
        "200":
          description: The charge with its updated balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFinanceCharge"
        "400":
          description: Invalid amount, method or date
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
        "404":
          description: Charge not found
  /admin/finance/charges/{id}/waive:
    post:
      operationId: waiveAdminFinanceCharge
      tags: [resident]
      summary: Waive all or part of a subscription charge
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceWaiverInput"
      responses:
        "200":
          description: The charge with its updated balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFinanceCharge"
        "400":
          description: Invalid amount, or the waiver exceeds the amount owed
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
        "404":
          description: Charge not found
  /admin/finance/expenses:
    get:
      operationId: getAdminFinanceExpenses
      tags: [resident]
      summary: Page through recorded association expenditure
      security:
        - clerkSession: []
      parameters:
        - name: periodId
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema:
            type: string
            enum:
              [
                printing-stationery,
                venue-hire,
                utilities,
                security,
                maintenance,
                welfare,
                bank-charges,
                transport,
                other,
              ]
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: A paginated list of expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFinanceExpensePage"
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
    post:
      operationId: createAdminFinanceExpense
      tags: [resident]
      summary: Record money paid out by the association
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceExpenseInput"
      responses:
        "200":
          description: The recorded expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFinanceExpense"
        "400":
          description: Invalid category, amount, date or description
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
        "404":
          description: Subscription period not found
  /admin/finance/expenses/{id}:
    delete:
      operationId: deleteAdminFinanceExpense
      tags: [resident]
      summary: Remove an expense recorded in error
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Confirmation that the expense was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceExpenseDeletion"
        "401":
          description: Authentication required
        "403":
          description: Administrator or treasurer role required
        "404":
          description: Expense not found
  /resident/subscription:
    get:
      operationId: getMySubscription
      tags: [resident]
      summary: The signed-in member's own subscription charge and payments
      security:
        - clerkSession: []
      responses:
        "200":
          description: The member's subscription status, or an empty list when none is raised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySubscription"
        "401":
          description: Authentication required
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublicOverview:
      type: object
      required:
        - membershipVerificationProgress
        - denominator
        - acceptedPetitionSignatures
        - rejectedPetitionSignatures
        - disputedPetitionSignatures
        - withdrawnPetitionSignatures
        - petitionStatus
        - proposedThreshold
        - twoThirdsThreshold
        - minimumQuorum
        - signaturesRemaining
        - thresholdReached
        - supportPercentage
      properties:
        membershipVerificationProgress:
          type: boolean
        denominator:
          type: ["integer", "null"]
        acceptedPetitionSignatures:
          type: integer
          minimum: 0
        rejectedPetitionSignatures:
          type: integer
          minimum: 0
        disputedPetitionSignatures:
          type: integer
          minimum: 0
        withdrawnPetitionSignatures:
          type: integer
          minimum: 0
        petitionStatus:
          type: string
          enum: [not-configured, scheduled, open, closed]
        proposedThreshold:
          type: ["integer", "null"]
        twoThirdsThreshold:
          type: ["integer", "null"]
        minimumQuorum:
          type: ["integer", "null"]
        signaturesRemaining:
          type: ["integer", "null"]
        thresholdReached:
          type: ["boolean", "null"]
        supportPercentage:
          type: ["number", "null"]
    PublicDocument:
      type: object
      required: [id, title, category, version, description, publishedAt, downloadUrl]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        version: { type: string }
        description: { type: string }
        publishedAt: { type: ["string", "null"], format: date-time }
        downloadUrl: { type: ["string", "null"], format: uri }
    PublicAnnouncement:
      type: object
      required: [id, title, body, publishedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        publishedAt: { type: string, format: date-time }
    PublicPetition:
      type: object
      required:
        - status
        - openingDate
        - closingDate
        - eligibilityText
        - constitutionVersion
        - petitionVersion
        - signingEnabled
        - proposedThreshold
      properties:
        status:
