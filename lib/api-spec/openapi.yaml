openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Salama Park Residents Association governance portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public, redacted association information
  - name: resident
    description: Authenticated resident operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/overview:
    get:
      operationId: getPublicOverview
      tags: [public]
      summary: Get public petition and membership progress
      responses:
        "200":
          description: Publicly approved aggregate progress only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOverview"
  /public/documents:
    get:
      operationId: getPublicDocuments
      tags: [public]
      summary: List approved public governance documents
      responses:
        "200":
          description: Approved public documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicDocument"
  /public/announcements:
    get:
      operationId: getPublicAnnouncements
      tags: [public]
      summary: List published public announcements
      responses:
        "200":
          description: Published announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAnnouncement"
  /public/petition:
    get:
      operationId: getPublicPetition
      tags: [public]
      summary: Get the active petition rules and exact document versions
      responses:
        "200":
          description: Petition details and whether signing is currently enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPetition"
  /public/poll:
    get:
      operationId: getPublicPollResults
      tags: [public]
      summary: Get the live monthly subscription poll and household tallies
      responses:
        "200":
          description: Aggregate poll results with no personal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPollResults"
  /resident/application:
    post:
      operationId: submitResidentApplication
      tags: [resident]
      summary: Submit an authenticated resident membership application
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentApplicationInput"
      responses:
        "201":
          description: Application received for verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentApplication"
        "400":
          description: Invalid application
        "401":
          description: Authentication required
        "409":
          description: An application already exists for this account
  /resident/application/me:
    get:
      operationId: getMyResidentApplication
      tags: [resident]
      summary: Get the authenticated resident's application status
      security:
        - clerkSession: []
      responses:
        "200":
          description: The resident's application or null when none exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentApplicationStatus"
        "401":
          description: Authentication required
  /resident/petition:
    post:
      operationId: submitPetitionConsent
      tags: [resident]
      summary: Submit an authenticated petition declaration for the exact published versions
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetitionConsentInput"
      responses:
        "201":
          description: Consent recorded and receipt issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetitionReceipt"
        "400":
          description: Declaration incomplete or invalid
        "401":
          description: Authentication required
        "409":
          description: Petition is closed or an active signature already exists
        "422":
          description: No approved petition and constitution versions are available
  /resident/petition/receipts:
    get:
      operationId: getMyPetitionReceipts
      tags: [resident]
      summary: List the authenticated resident's petition receipts without declaration details
      security:
        - clerkSession: []
      responses:
        "200":
          description: The resident's own petition receipt references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResidentPetitionReceipt"
        "401":
          description: Authentication required
  /resident/petition/withdraw:
    post:
      operationId: withdrawMyPetitionSignature
      tags: [resident]
      summary: Request withdrawal of the resident's active petition signature before closing
      security:
        - clerkSession: []
      responses:
        "200":
          description: Signature withdrawn with a new receipt status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetitionWithdrawal"
        "401":
          description: Authentication required
        "409":
          description: No active signature or petition withdrawal deadline has passed
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [resident]
      summary: Verify administrative role from server-side identity metadata
      security:
        - clerkSession: []
      responses:
        "200":
          description: Caller role and management access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
        "401":
          description: Authentication required
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [resident]
      summary: Get aggregate administrative workflow counts
      security:
        - clerkSession: []
      responses:
        "200":
          description: Administrative counts without exposing ballot choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Authentication required
        "403":
          description: Association administrator role required
  /admin/applications:
    get:
      operationId: getAdminApplications
      tags: [resident]
      summary: Search and page through membership applications for authorized reviewers
      security:
        - clerkSession: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending-verification, clarification-requested, verified, rejected]
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: A paginated, authorized application list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationPage"
        "401":
          description: Authentication required
        "403":
          description: Authorized association role required
  /admin/applications/{id}/review:
    post:
      operationId: reviewMembershipApplication
      tags: [resident]
      summary: Record a membership verification decision with a reason
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationReviewInput"
      responses:
        "200":
          description: Updated application decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplication"
        "400":
          description: Invalid decision or missing reason
        "401":
          description: Authentication required
        "403":
          description: Returning Officer or administrator role required
        "404":
          description: Application not found
  /admin/petition/submissions:
    get:
      operationId: getAdminPetitionSubmissions
      tags: [resident]
      summary: Page through petition submissions for verification review
      security:
        - clerkSession: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          schema:
            type: string
            enum: [accepted, disputed, rejected, withdrawn]
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: A paginated list of petition submissions for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPetitionSubmissionPage"
        "401":
          description: Authentication required
        "403":
          description: Returning Officer or administrator role required
  /admin/petition/submissions/{id}/verify:
    post:
      operationId: verifyPetitionSubmission
      tags: [resident]
      summary: Record a verification decision for a petition signature
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetitionVerificationInput"
      responses:
        "200":
          description: Updated verification decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPetitionSubmission"
        "400":
          description: Invalid verification decision or missing reason
        "401":
          description: Authentication required
        "403":
          description: Returning Officer or administrator role required
        "404":
          description: Submission not found
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublicOverview:
      type: object
      required:
        - membershipVerificationProgress
        - denominator
        - acceptedPetitionSignatures
        - rejectedPetitionSignatures
        - disputedPetitionSignatures
        - withdrawnPetitionSignatures
        - petitionStatus
        - proposedThreshold
        - twoThirdsThreshold
        - minimumQuorum
        - signaturesRemaining
        - thresholdReached
        - supportPercentage
      properties:
        membershipVerificationProgress:
          type: boolean
        denominator:
          type: ["integer", "null"]
        acceptedPetitionSignatures:
          type: integer
          minimum: 0
        rejectedPetitionSignatures:
          type: integer
          minimum: 0
        disputedPetitionSignatures:
          type: integer
          minimum: 0
        withdrawnPetitionSignatures:
          type: integer
          minimum: 0
        petitionStatus:
          type: string
          enum: [not-configured, scheduled, open, closed]
        proposedThreshold:
          type: ["integer", "null"]
        twoThirdsThreshold:
          type: ["integer", "null"]
        minimumQuorum:
          type: ["integer", "null"]
        signaturesRemaining:
          type: ["integer", "null"]
        thresholdReached:
          type: ["boolean", "null"]
        supportPercentage:
          type: ["number", "null"]
    PublicDocument:
      type: object
      required: [id, title, category, version, description, publishedAt, downloadUrl]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        version: { type: string }
        description: { type: string }
        publishedAt: { type: ["string", "null"], format: date-time }
        downloadUrl: { type: ["string", "null"], format: uri }
    PublicAnnouncement:
      type: object
      required: [id, title, body, publishedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        publishedAt: { type: string, format: date-time }
    PublicPetition:
      type: object
      required:
        - status
        - openingDate
        - closingDate
        - eligibilityText
        - constitutionVersion
        - petitionVersion
        - signingEnabled
        - proposedThreshold
      properties:
        status:
          type: string
          enum: [not-configured, scheduled, open, closed]
        openingDate:
          type: ["string", "null"]
          format: date-time
        closingDate:
          type: ["string", "null"]
          format: date-time
        eligibilityText:
          type: ["string", "null"]
        constitutionVersion:
          type: ["string", "null"]
        petitionVersion:
          type: ["string", "null"]
        signingEnabled:
          type: boolean
        proposedThreshold:
          type: ["integer", "null"]
    ResidentApplicationInput:
      type: object
      required:
        - fullName
        - houseNumber
        - streetOrZone
        - phone
        - livesInSalamaPark
        - preferredNotification
        - privacyNoticeAccepted
        - dateOfBirth
        - gender
        - nationality
        - residencyStatus
        - residencySince
        - ownsProperty
        - membershipCategory
        - subscriptionVote
        - agreeToPayAdopted
        - reliefOption
        - declarationConfirmResident
        - declarationReadConstitution
        - declarationMemberRegister
        - declarationVoterRoll
        - declarationContactConsent
        - declarationNoSubscription
        - declarationUndertakePayment
        - declarationUnderstandRelief
        - signatureName
      properties:
        # Section A — Personal identification
        fullName: { type: string, minLength: 2, maxLength: 160 }
        nrcNumber: { type: ["string", "null"], maxLength: 40 }
        passportNumber: { type: ["string", "null"], maxLength: 40 }
        dateOfBirth: { type: string, minLength: 8, maxLength: 10 }
        gender:
          type: string
          enum: [male, female, other]
        nationality: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string, minLength: 5, maxLength: 40 }
        phoneAlt: { type: ["string", "null"], maxLength: 40 }
        email: { type: ["string", "null"], format: email, maxLength: 254 }
        houseNumber: { type: string, minLength: 1, maxLength: 80 }
        streetOrZone: { type: string, minLength: 1, maxLength: 120 }
        plotNumber: { type: ["string", "null"], maxLength: 80 }
        # Section B — Residency
        livesInSalamaPark: { type: boolean }
        residencyStatus:
          type: string
          enum: [owner-occupier, tenant, owner-landlord, family-member]
        residencySince: { type: string, minLength: 4, maxLength: 32 }
        ownsProperty: { type: boolean }
        propertyPlots: { type: ["string", "null"], maxLength: 200 }
        wardRegisteredVoter: { type: ["boolean", "null"] }
        # Section C — Membership category
        membershipCategory:
          type: string
          enum: [full, associate, honorary]
        otherAssociationMember: { type: ["boolean", "null"] }
        otherAssociationName: { type: ["string", "null"], maxLength: 160 }
        # Section D — Subscription poll
        subscriptionVote:
          type: string
          enum: [k50, k100, k150]
        agreeToPayAdopted: { type: boolean }
        reliefOption:
          type: string
          enum: [yes, no, not-applicable]
        paymentMethod:
          type: ["string", "null"]
          enum: [mobile-money, bank-transfer, cash]
        # Section E — Declarations and signature
        declarationConfirmResident: { type: boolean }
        declarationReadConstitution: { type: boolean }
        declarationMemberRegister: { type: boolean }
        declarationVoterRoll: { type: boolean }
        declarationContactConsent: { type: boolean }
        declarationNoSubscription: { type: boolean }
        declarationUndertakePayment: { type: boolean }
        declarationUnderstandRelief: { type: boolean }
        signatureName: { type: string, minLength: 2, maxLength: 160 }
        # Section G — Associate and honorary members
        principalResidenceAddress: { type: ["string", "null"], maxLength: 240 }
        associationBasis: { type: ["string", "null"], maxLength: 240 }
        nominatedBy: { type: ["string", "null"], maxLength: 160 }
        # Section H — Optional planning and skills
        occupation: { type: ["string", "null"], maxLength: 120 }
        willingToVolunteer: { type: ["boolean", "null"] }
        volunteerSkills: { type: ["string", "null"], maxLength: 500 }
        accessNeeds: { type: ["string", "null"], maxLength: 500 }
        preferredLanguage:
          type: ["string", "null"]
          enum: [english, nyanja, bemba, tonga, other]
        # Additional household and emergency details
        adultsInHousehold: { type: ["integer", "null"], minimum: 1, maximum: 30 }
        emergencyContactName: { type: ["string", "null"], maxLength: 160 }
        emergencyContactPhone: { type: ["string", "null"], maxLength: 40 }
        emergencyContactRelationship: { type: ["string", "null"], maxLength: 80 }
        preferredNotification:
          type: string
          enum: [email, sms, none]
        privacyNoticeAccepted: { type: boolean }
    ResidentApplication:
      type: object
      required: [id, reference, status, submittedAt, subscriptionVote]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status:
          type: string
          enum: [pending-verification, clarification-requested, verified, rejected]
        submittedAt: { type: string, format: date-time }
        subscriptionVote:
          type: ["string", "null"]
          enum: [k50, k100, k150]
    ResidentApplicationStatus:
      type: object
      required: [application]
      properties:
        application:
          oneOf:
            - $ref: "#/components/schemas/ResidentApplication"
            - type: "null"
    PetitionConsentInput:
      type: object
      required:
        - readConstitution
        - consentToVersion
        - truthfulResidency
        - understandDataUse
        - understandFoundingProvisions
        - understandWithdrawal
        - voluntary
      properties:
        readConstitution: { type: boolean }
        consentToVersion: { type: boolean }
        truthfulResidency: { type: boolean }
        understandDataUse: { type: boolean }
        understandFoundingProvisions: { type: boolean }
        understandWithdrawal: { type: boolean }
        voluntary: { type: boolean }
    PetitionReceipt:
      type: object
      required: [reference, submittedAt, constitutionVersion, petitionVersion, status]
      properties:
        reference: { type: string }
        submittedAt: { type: string, format: date-time }
        constitutionVersion: { type: string }
        petitionVersion: { type: string }
        status: { type: string, enum: [accepted] }
        subscriptionVote:
          type: ["string", "null"]
          enum: [k50, k100, k150]
    ResidentPetitionReceipt:
      type: object
      required: [reference, submittedAt, constitutionVersion, petitionVersion, status]
      properties:
        reference: { type: string }
        submittedAt: { type: string, format: date-time }
        constitutionVersion: { type: string }
        petitionVersion: { type: string }
        status:
          type: string
          enum: [accepted, disputed, rejected, withdrawn]
        subscriptionVote:
          type: ["string", "null"]
          enum: [k50, k100, k150]
    PetitionWithdrawal:
      type: object
      required: [reference, status, withdrawnAt]
      properties:
        reference: { type: string }
        status: { type: string, enum: [withdrawn] }
        withdrawnAt: { type: string, format: date-time }
    AdminAccess:
      type: object
      required: [allowed, role]
      properties:
        allowed: { type: boolean }
        role: { type: ["string", "null"] }
    AdminDashboard:
      type: object
      required:
        - totalApplications
        - pendingApplications
        - clarificationRequested
        - verifiedApplications
        - rejectedApplications
        - acceptedPetitionSignatures
        - verifiedDenominator
        - petitionStatus
        - twoThirdsThreshold
        - minimumQuorum
        - signaturesRemaining
        - thresholdReached
        - totalVotes
        - votesK50
        - votesK100
        - votesK150
        - currentWinner
        - homeowners
        - tenants
        - volunteers
        - onlineVotingConsent
        - unverifiedSignatures
        - duplicateFlags
      properties:
        totalApplications: { type: integer, minimum: 0 }
        pendingApplications: { type: integer, minimum: 0 }
        clarificationRequested: { type: integer, minimum: 0 }
        verifiedApplications: { type: integer, minimum: 0 }
        rejectedApplications: { type: integer, minimum: 0 }
        acceptedPetitionSignatures: { type: integer, minimum: 0 }
        verifiedDenominator: { type: ["integer", "null"], minimum: 0 }
        twoThirdsThreshold: { type: ["integer", "null"], minimum: 0 }
        minimumQuorum: { type: ["integer", "null"], minimum: 0 }
        signaturesRemaining: { type: ["integer", "null"], minimum: 0 }
        thresholdReached: { type: ["boolean", "null"] }
        totalVotes: { type: integer, minimum: 0 }
        votesK50: { type: integer, minimum: 0 }
        votesK100: { type: integer, minimum: 0 }
        votesK150: { type: integer, minimum: 0 }
        currentWinner:
          type: ["string", "null"]
          enum: [k50, k100, k150]
        homeowners: { type: integer, minimum: 0 }
        tenants: { type: integer, minimum: 0 }
        volunteers: { type: integer, minimum: 0 }
        onlineVotingConsent: { type: integer, minimum: 0 }
        unverifiedSignatures: { type: integer, minimum: 0 }
        duplicateFlags: { type: integer, minimum: 0 }
        petitionStatus:
          type: string
          enum: [not-configured, scheduled, open, closed]
    AdminApplication:
      type: object
      required: [id, reference, fullName, houseNumber, streetOrZone, phone, email, status, submittedAt, decisionReason]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        fullName: { type: string }
        houseNumber: { type: string }
        streetOrZone: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"], format: email }
        status:
          type: string
          enum: [pending-verification, clarification-requested, verified, rejected]
        submittedAt: { type: string, format: date-time }
        decisionReason: { type: ["string", "null"] }
        nrcNumber: { type: ["string", "null"] }
        passportNumber: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        gender:
          type: ["string", "null"]
          enum: [male, female, other]
        nationality: { type: ["string", "null"] }
        residencyStatus:
          type: ["string", "null"]
          enum: [owner-occupier, tenant, owner-landlord, family-member]
        residencySince: { type: ["string", "null"] }
        ownsProperty: { type: ["boolean", "null"] }
        membershipCategory:
          type: ["string", "null"]
          enum: [full, associate, honorary]
        subscriptionVote:
          type: ["string", "null"]
          enum: [k50, k100, k150]
        membershipNumber: { type: ["string", "null"] }
        admittedAt: { type: ["string", "null"], format: date-time }
        receivedBy: { type: ["string", "null"] }
        verifiedAgainstNrc: { type: ["boolean", "null"] }
        rejectionCategory:
          type: ["string", "null"]
          enum: [duplicate, not-resident, incomplete-declaration, other]
        verificationNotes: { type: ["string", "null"] }
    AdminApplicationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminApplication"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    ApplicationReviewInput:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [clarification-requested, verified, rejected]
        reason: { type: string, minLength: 3, maxLength: 1000 }
        receivedBy: { type: ["string", "null"], maxLength: 160 }
        verifiedAgainstNrc: { type: ["boolean", "null"] }
        rejectionCategory:
          type: ["string", "null"]
          enum: [duplicate, not-resident, incomplete-declaration, other]
        verificationNotes: { type: ["string", "null"], maxLength: 1000 }
    PublicPollResults:
      type: object
      required:
        - totalVotes
        - votesK50
        - votesK100
        - votesK150
        - percentageK50
        - percentageK100
        - percentageK150
        - currentWinner
        - homeowners
        - tenants
        - totalAdults
        - volunteers
        - onlineVotingConsent
      properties:
        totalVotes: { type: integer, minimum: 0 }
        votesK50: { type: integer, minimum: 0 }
        votesK100: { type: integer, minimum: 0 }
        votesK150: { type: integer, minimum: 0 }
        percentageK50: { type: number }
        percentageK100: { type: number }
        percentageK150: { type: number }
        currentWinner:
          type: ["string", "null"]
          enum: [k50, k100, k150]
        homeowners: { type: integer, minimum: 0 }
        tenants: { type: integer, minimum: 0 }
        totalAdults: { type: integer, minimum: 0 }
        volunteers: { type: integer, minimum: 0 }
        onlineVotingConsent: { type: integer, minimum: 0 }
    AdminPetitionSubmission:
      type: object
      required:
        - id
        - reference
        - userId
        - fullName
        - houseNumber
        - streetOrZone
        - phone
        - status
        - onMembersRegister
        - duplicateFlag
        - verifiedBy
        - verifiedAt
        - verificationNotes
        - submittedAt
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        userId: { type: string }
        fullName: { type: string }
        houseNumber: { type: string }
        streetOrZone: { type: string }
        phone: { type: string }
        status:
          type: string
          enum: [accepted, disputed, rejected, withdrawn]
        onMembersRegister: { type: ["boolean", "null"] }
        duplicateFlag: { type: ["boolean", "null"] }
        verifiedBy: { type: ["string", "null"] }
        verifiedAt: { type: ["string", "null"], format: date-time }
        verificationNotes: { type: ["string", "null"] }
        submittedAt: { type: string, format: date-time }
    AdminPetitionSubmissionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPetitionSubmission"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PetitionVerificationInput:
