        id: { type: string, format: uuid }
        deleted: { type: boolean }
    AdminFinanceOverview:
      type: object
      required:
        - period
        - membersCharged
        - fullyPaid
        - partPaid
        - outstanding
        - waived
        - amountBilled
        - amountCollected
        - amountOutstanding
        - amountWaived
        - amountSpent
        - creditBalance
        - balance
        - byCategory
        - recentPayments
      properties:
        period:
          type: ["object", "null"]
          $ref: "#/components/schemas/FinancePeriod"
        membersCharged: { type: integer, minimum: 0 }
        fullyPaid: { type: integer, minimum: 0 }
        partPaid: { type: integer, minimum: 0 }
        outstanding: { type: integer, minimum: 0 }
        waived: { type: integer, minimum: 0 }
        amountBilled: { type: integer, minimum: 0 }
        amountCollected: { type: integer, minimum: 0 }
        amountOutstanding: { type: integer, minimum: 0 }
        amountWaived: { type: integer, minimum: 0 }
        amountSpent: { type: integer, minimum: 0 }
        # Money received beyond what has been billed, so collected can exceed
        # billed and the figures still add up:
        # billed = collected + waived + outstanding - creditBalance
        creditBalance: { type: integer, minimum: 0 }
        balance: { type: integer }
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/FinanceCategoryTotal"
        recentPayments:
          type: array
          items:
            $ref: "#/components/schemas/AdminFinancePayment"
    AdminGeoStreetStats:
      type: object
      required:
        - streets
      properties:
        streets:
          type: array
          items:
            $ref: "#/components/schemas/AdminGeoStreetStat"
    AdminGeoStreetStat:
      type: object
      required:
        - key
        - label
        - count
        - lat
        - lng
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
    FinanceCategoryTotal:
      type: object
      required: [category, amount, entries]
      properties:
        category: { type: string }
        amount: { type: integer, minimum: 0 }
        entries: { type: integer, minimum: 0 }
    AdminFinancePayment:
      type: object
      required: [id, chargeId, amount, method, paidOn]
      properties:
        id: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        memberName: { type: ["string", "null"] }
        membershipNumber: { type: ["string", "null"] }
        amount: { type: integer, minimum: 0 }
        method:
          type: string
          enum: [mobile-money, bank-transfer, cash]
        reference: { type: ["string", "null"] }
        paidOn: { type: string }
        receivedBy: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    MySubscription:
      type: object
      required: [currency, charges]
      properties:
        currency: { type: string }
        # Empty when no charge has been raised for this account yet.
        charges:
          type: array
          items:
            $ref: "#/components/schemas/MySubscriptionCharge"
    MySubscriptionCharge:
      type: object
      required: [id, year, amountDue, amountPaid, amountWaived, balance, status, payments]
      properties:
        id: { type: string, format: uuid }
        year: { type: integer }
        membershipNumber: { type: ["string", "null"] }
        amountDue: { type: integer, minimum: 0 }
        amountPaid: { type: integer, minimum: 0 }
        amountWaived: { type: integer, minimum: 0 }
        balance: { type: integer }
        status:
          type: string
          enum: [outstanding, part-paid, paid, waived]
        dueDate: { type: ["string", "null"] }
        payments:
          type: array
          items:
            $ref: "#/components/schemas/MySubscriptionPayment"
    MySubscriptionPayment:
      type: object
      required: [id, amount, method, paidOn]
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer, minimum: 0 }
        method:
          type: string
          enum: [mobile-money, bank-transfer, cash]
        reference: { type: ["string", "null"] }
        paidOn: { type: string }

